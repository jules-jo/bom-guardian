name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Render free instance
        run: |
          curl -s -o /dev/null -w "first: %{http_code}\n" --max-time 60 https://bom-guardian.onrender.com/_stcore/health || true
          sleep 20
          curl -s -o /dev/null -w "second: %{http_code}\n" --max-time 60 https://bom-guardian.onrender.com/_stcore/health
